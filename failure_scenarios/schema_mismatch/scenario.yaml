skill: request-coverage
arguments:
  worker_id: SYN-USER-IVAN
  hours: "8"
  time_off_type_wid: fde00000000000000000000000000031
  client_request_id: story-schema
  coverage_note: Desk coverage for the lab engagement.
expected_code: schema_mismatch
validation: clean_write
